name: CI

on:
  push:
    branches: [ "main", "audit-fixes" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          cd web
          corepack pnpm install --frozen-lockfile

      - name: Frontend Lint
        run: |
          cd web
          corepack pnpm lint

      - name: Frontend Build
        run: ./build-frontend.sh

      - name: Verify committed dist matches build
        run: git diff --exit-code -- public/dist
