name: Validate English frontend

on:
  push:
    branches:
      - refactor/quality-cleanup
    paths:
      - web/**
      - .github/workflows/frontend-english-check.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quality-cleanup
      - name: Check for Chinese frontend text
        run: |
          if grep -RInP '[\x{4e00}-\x{9fff}]' web/src web/index.html; then
            echo "Chinese text remains in frontend source."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install pnpm
        run: npm install --global pnpm@12.5.1
      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          mkdir -p public/dist
          find public/dist -mindepth 1 ! -name README.md -delete
          cp -a web/dist/. public/dist/
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh English frontend assets"
          git push origin HEAD:refactor/quality-cleanup
