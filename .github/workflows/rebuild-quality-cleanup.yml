name: Rebuild quality-cleanup frontend

on:
  push:
    branches:
      - refactor/quality-cleanup
    paths:
      - web/**
      - build-frontend.sh
      - .github/workflows/rebuild-quality-cleanup.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quality-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install pnpm
        run: npm install --global pnpm@12.5.1
      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          mkdir -p public/dist
          find public/dist -mindepth 1 ! -name README.md -delete
          cp -a web/dist/. public/dist/
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh frontend assets"
          git push origin HEAD:refactor/quality-cleanup
