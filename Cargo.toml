[package]
name = "rulist"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
authors = ["ubuntu <mhy2253@qq.com>"]
description = "A lightweight, high-performance file listing tool written in Rust (Rulist)"

[dependencies]
# Async runtime & HTTP server
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.5"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Cryptography & Security
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
subtle = "2.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Static asset embedding
rust-embed = "8.5"
mime_guess = "2.0"

# Utilities
chrono = "0.4"
anyhow = "1.0"
futures-util = "0.3"
pulldown-cmark = "0.12"
ammonia = "4.0"
csv = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"


[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
